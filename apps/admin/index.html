<!doctype html><html lang="uz"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TEGEN Admin</title><style>:root{--red:#e51b23;--bg:#f5f6f8;--ink:#202124;--muted:#777}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,Arial,sans-serif;color:var(--ink)}header{background:var(--red);color:#fff;padding:18px 24px;display:flex;justify-content:space-between;align-items:center}header h1{margin:0}.container{max-width:1200px;margin:auto;padding:18px}.tabs{display:flex;gap:8px;overflow:auto;margin-bottom:16px}.tab{border:0;background:#fff;border-radius:999px;padding:11px 15px;font-weight:800;white-space:nowrap}.tab.active{background:var(--red);color:#fff}.panel,.card{background:#fff;border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 2px 10px #0000000b}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}.label{color:var(--muted);font-size:12px}.value{font-size:23px;font-weight:900;margin-top:5px}.form{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.form>*{min-width:0}.form input,.form textarea,.form select{width:100%;padding:11px;border:1px solid #ddd;border-radius:10px}.full{grid-column:1/-1}button{cursor:pointer}.btn{border:0;background:var(--red);color:#fff;border-radius:10px;padding:10px 14px;font-weight:800}.btn2{border:1px solid #ddd;background:#fff;border-radius:10px;padding:9px 12px;font-weight:700}.danger{background:#b91c1c}.ok{background:#16a34a}.muted{color:var(--muted)}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:10px;border-bottom:1px solid #eee}.badge{padding:4px 8px;border-radius:8px;background:#eee;font-size:11px}.actions{display:flex;gap:6px;flex-wrap:wrap}#login{max-width:430px;margin:70px auto;background:#fff;padding:25px;border-radius:20px}.login-input{width:100%;padding:13px;margin:6px 0 13px;border:1px solid #ddd;border-radius:12px}.login-btn{width:100%;padding:13px;border:0;border-radius:12px;background:var(--red);color:#fff;font-weight:900}.hero{background:linear-gradient(135deg,#e51b23,#9b0d12);color:#fff;border-radius:18px;padding:20px;margin-bottom:15px}.hero b{font-size:26px}@media(max-width:650px){.form{grid-template-columns:1fr}table{display:block;overflow:auto;white-space:nowrap}}
</style></head><body><section id="login"><h2>TEGEN Admin</h2><p class="muted">Admin yoki Ega sifatida kirish</p><label>Server API</label><input class="login-input" id="api" placeholder="https://...railway.app"><label>ADMIN_PANEL_TOKEN</label><input class="login-input" id="token" type="password"><label>Telegram ID (kim sifatida kiryapsiz?)</label><input class="login-input" id="actor" placeholder="Ega/Admin Telegram ID"><button class="login-btn" onclick="login()">Kirish</button><p id="err" style="color:#c00"></p></section><section id="app" style="display:none"><header><div><h1>TEGEN Admin</h1><small>OWNER / ADMIN boshqaruvi</small></div><button class="btn2" onclick="logout()">Chiqish</button></header><div class="container"><div class="tabs"><button class="tab active" data-t="dashboard" onclick="tab('dashboard')">📊 Dashboard</button><button class="tab" data-t="orders" onclick="tab('orders')">📦 Buyurtmalar</button><button class="tab" data-t="products" onclick="tab('products')">🛍 Mahsulotlar</button><button class="tab" data-t="categories" onclick="tab('categories')">📁 Katalog</button><button class="tab" data-t="banners" onclick="tab('banners')">🖼 Bannerlar</button><button class="tab" data-t="nak" onclick="tab('nak')">💳 Nakopitel</button><button class="tab" data-t="staff" onclick="tab('staff')">👥 Xodimlar</button><button class="tab" data-t="proposals" onclick="tab('proposals')">📝 Tasdiqlar</button><button class="tab" data-t="audit" onclick="tab('audit')">📜 Audit</button></div><div id="view"></div></div></section><script>
let API=localStorage.getItem('tegen_api')||'',TOKEN=localStorage.getItem('tegen_token')||'',ACTOR=localStorage.getItem('tegen_actor')||'',cats=[];const $=id=>document.getElementById(id);const fmt=n=>Number(n||0).toLocaleString('ru-RU').replace(/,/g,' ');
async function api(path,opt={}){let r=await fetch(API+path,{...opt,headers:{'Content-Type':'application/json','x-admin-token':TOKEN,'x-admin-telegram-id':ACTOR,...(opt.headers||{})}});if(!r.ok)throw Error(await r.text());return r.json()}
async function login(){API=$('api').value.trim().replace(/\/$/,'');TOKEN=$('token').value.trim();ACTOR=$('actor').value.trim();try{await api('/stats/dashboard');localStorage.setItem('tegen_api',API);localStorage.setItem('tegen_token',TOKEN);localStorage.setItem('tegen_actor',ACTOR);$('login').style.display='none';$('app').style.display='block';tab('dashboard')}catch(e){$('err').textContent='Ulanib bo‘lmadi: token yoki Telegram ID ni tekshiring.'}}
function logout(){localStorage.clear();location.reload()}function tab(t){document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.t===t));({dashboard:dash,orders:orders,products:products,categories:categories,banners:banners,nak:nak,staff:staff,proposals:proposals,audit:audit}[t]||dash)()}
async function dash(){let s=await api('/stats/dashboard');$('view').innerHTML='<div class="hero"><b>TEGEN boshqaruv markazi</b><div>Qaysi xodim nima qilgani Audit bo‘limida saqlanadi.</div></div><div class="cards">'+[['Bugungi buyurtmalar',s.todayOrders],['Kutilayotgan',s.pendingOrders],['Yakunlangan',s.completedOrders],['Mijozlar',s.totalUsers],['Mahsulotlar',s.totalProducts],['Bugungi savdo',fmt(s.todayRevenue)+' so‘m'],['Oy savdosi',fmt(s.monthRevenue)+' so‘m'],['Jami savdo',fmt(s.totalRevenue)+' so‘m']].map(x=>`<div class="card"><div class="label">${x[0]}</div><div class="value">${x[1]}</div></div>`).join('')+'</div>'}
async function orders(){let os=await api('/orders');$('view').innerHTML='<div class="panel"><h3>Buyurtmalar</h3><table><tr><th>ID</th><th>Mijoz</th><th>Mahsulotlar</th><th>Jami</th><th>Holat</th><th>Amal</th></tr>'+os.map(o=>`<tr><td>#${o.id.slice(0,8)}</td><td>${o.user?.firstName||'—'}<br>${o.user?.phone||''}</td><td>${(o.items||[]).map(i=>i.name+' × '+i.quantity).join(', ')}</td><td>${fmt(o.totalPrice)} so‘m</td><td><span class="badge">${o.status}</span>${o.approvedBy?' — '+(o.approvedBy.firstName||o.approvedBy.username):''}</td><td class="actions">${o.status==='PENDING'?`<button class="btn ok" onclick="setStatus('${o.id}','ACCEPTED')">Qabul</button><button class="btn danger" onclick="reject('${o.id}')">Rad</button>`:''}${o.status==='ACCEPTED'?`<button class="btn" onclick="setStatus('${o.id}','DELIVERING')">Yetkazish</button>`:''}${o.status==='DELIVERING'?`<button class="btn ok" onclick="setStatus('${o.id}','COMPLETED')">Yakunlash</button>`:''}</td></tr>`).join('')+'</table></div>'}
async function setStatus(id,status,rejectReason){await api('/orders/'+id+'/status',{method:'PATCH',body:JSON.stringify({status,rejectReason})});orders()}function reject(id){let r=prompt('Rad etish sababi');if(r!==null)setStatus(id,'REJECTED',r)}
async function categories(){cats=await api('/categories?admin=true');$('view').innerHTML='<div class="panel"><h3>➕ Kategoriya</h3><div class="form"><input id="cn" placeholder="Nomi"><input id="ci" placeholder="Ikonka 🍞"><button class="btn full" onclick="addCat()">Qo‘shish</button></div></div><div class="panel"><table><tr><th>Nomi</th><th>Mahsulot</th><th>Holat</th><th>Amal</th></tr>'+cats.map(c=>`<tr><td>${c.icon||''} ${c.name}</td><td>${c._count?.products||0}</td><td>${c.isActive?'Faol':'Nofaol'}</td><td><button class="btn2" onclick="toggleCat('${c.id}',${!c.isActive})">${c.isActive?'O‘chirish':'Yoqish'}</button></td></tr>`).join('')+'</table></div>'}
async function addCat(){await api('/categories',{method:'POST',body:JSON.stringify({name:$('cn').value,icon:$('ci').value})});categories()}async function toggleCat(id,isActive){await api('/categories/'+id,{method:'PATCH',body:JSON.stringify({isActive})});categories()}
async function products(){if(!cats.length)cats=await api('/categories?admin=true');let ps=await api('/products?admin=true');$('view').innerHTML='<div class="panel"><h3>➕ Mahsulot</h3><div class="form"><input id="pn" placeholder="Nomi"><select id="pc">'+cats.map(c=>`<option value="${c.id}">${c.name}</option>`).join('')+'</select><input id="pp" type="number" placeholder="Narxi"><input id="po" type="number" placeholder="Eski narxi"><input id="pi" placeholder="Rasm URL"><input id="pd" placeholder="Bo‘lim"><textarea id="px" class="full" placeholder="Tavsif"></textarea><button class="btn full" onclick="addProd()">Qo‘shish</button></div></div><div class="panel"><table><tr><th>Rasm</th><th>Nomi</th><th>Kategoriya</th><th>Narx</th><th>Amal</th></tr>'+ps.map(p=>`<tr><td>${p.image?`<img src="${p.image}" style="width:45px;height:45px;object-fit:contain">`:'—'}</td><td>${p.name}</td><td>${p.category?.name||''}</td><td>${fmt(p.price)} so‘m</td><td><button class="btn2" onclick="toggleProd('${p.id}',${!p.isActive})">${p.isActive?'O‘chirish':'Yoqish'}</button></td></tr>`).join('')+'</table></div>'}
async function addProd(){await api('/products',{method:'POST',body:JSON.stringify({name:$('pn').value,categoryId:$('pc').value,price:+$('pp').value,oldPrice:+$('po').value||undefined,image:$('pi').value||undefined,department:$('pd').value||undefined,description:$('px').value||undefined})});products()}async function toggleProd(id,isActive){await api('/products/'+id,{method:'PATCH',body:JSON.stringify({isActive})});products()}
async function banners(){let bs=await api('/banners/admin');$('view').innerHTML='<div class="panel"><h3>🖼 Banner qo‘shish</h3><div class="form"><input id="bt" placeholder="Sarlavha"><input id="bs" placeholder="Qo‘shimcha matn"><input id="bi" placeholder="Rasm URL"><input id="bb" placeholder="Tugma, masalan Ko‘rish"><select id="btype"><option value="NONE">NONE</option><option value="CATEGORY">CATEGORY</option><option value="PRODUCT">PRODUCT</option><option value="URL">URL</option></select><input id="btarget" placeholder="Target ID yoki URL"><input id="bo" type="number" placeholder="Tartib"><button class="btn full" onclick="addBanner()">Banner yaratish</button></div></div><div class="panel"><table><tr><th>Rasm</th><th>Banner</th><th>Holat</th><th>Amal</th></tr>'+bs.map(b=>`<tr><td><img src="${b.imageUrl}" style="width:100px;height:55px;object-fit:cover;border-radius:8px"></td><td><b>${b.title}</b><br>${b.subtitle||''}</td><td>${b.isActive?'Faol':'Nofaol'}</td><td><button class="btn2" onclick="offBanner('${b.id}')">O‘chirish</button></td></tr>`).join('')+'</table></div>'}
async function addBanner(){await api('/banners',{method:'POST',body:JSON.stringify({title:$('bt').value,subtitle:$('bs').value,imageUrl:$('bi').value,buttonText:$('bb').value,targetType:$('btype').value,targetId:$('btarget').value||undefined,sortOrder:+$('bo').value||0})});banners()}async function offBanner(id){await api('/banners/'+id,{method:'DELETE'});banners()}
async function nak(){let a=await api('/nakopitel');$('view').innerHTML='<div class="panel"><h3>💳 Nakopitel arizalari</h3><table><tr><th>Mijoz</th><th>Telefon</th><th>Status</th><th>Amal</th></tr>'+a.map(x=>`<tr><td>${x.user?.firstName||'—'}<br>${x.user?.telegramId}</td><td>${x.user?.phone||'—'}</td><td>${x.status}</td><td>${x.status==='PENDING'?`<button class="btn ok" onclick="nakReview('${x.id}',true)">Tasdiqlash</button> <button class="btn danger" onclick="nakReview('${x.id}',false)">Rad</button>`:(x.reviewedBy?'Ko‘rdi: '+(x.reviewedBy.firstName||x.reviewedBy.username):'')}</td></tr>`).join('')+'</table></div>'}async function nakReview(id,approved){let note=approved?'Tasdiqlandi':prompt('Rad etish sababi')||'Rad etildi';await api('/nakopitel/'+id+'/review',{method:'POST',body:JSON.stringify({approved,note})});nak()}
async function staff(){let u=await api('/users/staff/list');$('view').innerHTML='<div class="panel"><h3>👥 Xodim qo‘shish (faqat Ega)</h3><div class="form"><input id="sid" placeholder="Telegram ID"><select id="sr"><option value="ADMIN">ADMIN</option><option value="WORKER">WORKER</option></select><input id="sd" placeholder="Bo‘lim, masalan nonchi"><button class="btn full" onclick="addStaff()">Qo‘shish</button></div></div><div class="panel"><table><tr><th>Ism</th><th>ID</th><th>Rol</th><th>Bo‘lim</th><th>Amal</th></tr>'+u.map(x=>`<tr><td>${x.firstName||'—'}</td><td>${x.telegramId}</td><td>${x.role}</td><td>${x.department||'—'}</td><td>${x.role!=='OWNER'?`<button class="btn danger" onclick="removeStaff('${x.telegramId}')">Chiqarish</button>`:''}</td></tr>`).join('')+'</table></div>'}async function addStaff(){await api('/users/staff',{method:'POST',body:JSON.stringify({telegramId:$('sid').value,role:$('sr').value,department:$('sd').value||undefined})});staff()}async function removeStaff(id){if(confirm('Chiqarilsinmi?')){await api('/users/staff/'+id+'/remove',{method:'PATCH'});staff()}}
async function proposals(){let p=await api('/proposals?status=PENDING');$('view').innerHTML='<div class="panel"><h3>📝 Ishchi takliflari</h3><table><tr><th>Mahsulot</th><th>Ishchi</th><th>Bo‘lim</th><th>Narx</th><th>Amal</th></tr>'+p.map(x=>`<tr><td>${x.name}</td><td>${x.worker?.firstName||x.worker?.telegramId}</td><td>${x.department}</td><td>${fmt(x.price)} so‘m</td><td><button class="btn ok" onclick="reviewP('${x.id}',true)">Tasdiqlash</button> <button class="btn danger" onclick="reviewP('${x.id}',false)">Rad</button></td></tr>`).join('')+'</table></div>'}async function reviewP(id,approved){await api('/proposals/'+id+'/review',{method:'POST',body:JSON.stringify({approved,note:approved?'Tasdiqlandi':prompt('Sabab')||'Rad etildi'})});proposals()}
async function audit(){let a=await api('/audit?limit=100');$('view').innerHTML='<div class="panel"><h3>📜 Audit — kim nima qilgan</h3><table><tr><th>Vaqt</th><th>Kim</th><th>Rol</th><th>Amal</th><th>Obyekt</th></tr>'+a.map(x=>`<tr><td>${new Date(x.createdAt).toLocaleString('uz-UZ')}</td><td>${x.actorName||'SYSTEM'}</td><td>${x.actorRole||''}</td><td>${x.action}</td><td>${x.entityType} ${x.entityId?('#'+x.entityId.slice(0,8)):''}</td></tr>`).join('')+'</table></div>'}
if(API&&TOKEN){api('/stats/dashboard').then(()=>{$('login').style.display='none';$('app').style.display='block';tab('dashboard')}).catch(()=>{$('api').value=API;$('actor').value=ACTOR})}else $('api').value='https://tegenserver-production.up.railway.app';</script></body></html>
